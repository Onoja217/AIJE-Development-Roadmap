name: Incident Lifecycle E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - ".github/workflows/incident-lifecycle-e2e.yml"

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify required staging secrets are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_OPERATOR_EMAIL: ${{ secrets.E2E_OPERATOR_EMAIL }}
          E2E_OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}
          E2E_ORGANIZATION_ID: ${{ secrets.E2E_ORGANIZATION_ID }}
          E2E_OTHER_ORGANIZATION_ID: ${{ secrets.E2E_OTHER_ORGANIZATION_ID }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY E2E_OPERATOR_EMAIL E2E_OPERATOR_PASSWORD E2E_ORGANIZATION_ID E2E_OTHER_ORGANIZATION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit $missing
      - name: Verify authenticated lifecycle and tenant isolation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_OPERATOR_EMAIL: ${{ secrets.E2E_OPERATOR_EMAIL }}
          E2E_OPERATOR_PASSWORD: ${{ secrets.E2E_OPERATOR_PASSWORD }}
          E2E_ORGANIZATION_ID: ${{ secrets.E2E_ORGANIZATION_ID }}
          E2E_OTHER_ORGANIZATION_ID: ${{ secrets.E2E_OTHER_ORGANIZATION_ID }}
        run: deno test --node-modules-dir=auto --allow-net --allow-env supabase/functions/incident-lifecycle/e2e_test.ts
